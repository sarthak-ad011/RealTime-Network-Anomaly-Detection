apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: inference-health-check
  namespace: mlops
spec:
  args:
    # Declared here, supplied by the Rollout's analysis step via
    # valueFrom.podTemplateHashValue. Declaring valueFrom on the template itself
    # does not populate it — the analysis then errors with "argument canary-hash
    # was not supplied" and Argo Rollouts aborts the canary for a config fault
    # rather than a real signal. Every query below filters on this so the analysis
    # measures ONLY canary pods; an unscoped query averages the canary in with the
    # healthy stable fleet and can let a broken canary pass.
    - name: canary-hash
  metrics:
    # Standard SLO gate: the canary must stay fast.
    - name: p99-latency
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: result[0] < 0.2
      provider:
        prometheus:
          address: http://prom-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99,
              sum by (le) (
                rate(anomaly_prediction_latency_seconds_bucket{
                  role="champion",
                  rollouts_pod_template_hash="{{args.canary-hash}}"
                }[2m])
              )
            )
    # ML-specific gate: a model can be fast and healthy by every infra measure while
    # being behaviourally broken — e.g. flagging every flow as an attack. Guard the
    # prediction distribution itself, not just latency and error rate.
    - name: anomaly-flag-rate
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: result[0] < 0.15
      provider:
        prometheus:
          address: http://prom-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(anomaly_predictions_total{
              is_anomaly="1",
              rollouts_pod_template_hash="{{args.canary-hash}}"
            }[2m]))
            /
            clamp_min(
              sum(rate(anomaly_predictions_total{
                rollouts_pod_template_hash="{{args.canary-hash}}"
              }[2m])),
              0.001
            )

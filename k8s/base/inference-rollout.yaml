apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: anomaly-inference
  namespace: mlops
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: anomaly-inference
  template:
    metadata:
      labels:
        app: anomaly-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: anomaly-sa
      containers:
        - name: api
          image: 170420138680.dkr.ecr.ap-south-1.amazonaws.com/anomaly-mlops:fd80dbd
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            # boto3 resolves credentials from the node role via IMDS but will not
            # reliably infer a region there; without this the S3 client fails at import.
            - name: AWS_REGION
              value: ap-south-1
            - name: AWS_DEFAULT_REGION
              value: ap-south-1
            - name: PREDICTION_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: prediction_bucket
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
  strategy:
    canary:
      stableService: anomaly-inference-stable
      canaryService: anomaly-inference-canary
      steps:
        - setWeight: 10
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: inference-health-check
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 30
        - pause:
            duration: 2m
        - setWeight: 60
        - pause:
            duration: 2m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-inference-stable
  namespace: mlops
spec:
  selector:
    app: anomaly-inference
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-inference-canary
  namespace: mlops
spec:
  selector:
    app: anomaly-inference
  ports:
    - port: 80
      targetPort: 8000

apiVersion: v1
kind: Namespace
metadata:
  name: mlops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: anomaly-sa
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.14.1
          # The upstream MLflow image ships without a Postgres driver or boto3, so it
          # cannot reach the RDS backend store or the S3 artifact root as-is. Install
          # both before starting the server.
          command: ["/bin/sh", "-c"]
          args:
            - >-
              pip install --no-cache-dir --quiet psycopg2-binary boto3 &&
              exec mlflow server
              --host=0.0.0.0 --port=5000
              --backend-store-uri="$BACKEND_URI"
              --default-artifact-root="$ARTIFACT_ROOT"
          env:
            - name: BACKEND_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-db
                  key: backend_uri
            - name: ARTIFACT_ROOT
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: artifact_root
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000

# EKS managed node groups cap the IMDS hop limit at 1, so containers cannot reach
# instance metadata and cannot borrow the node role's credentials. This service
# account is bound to a dedicated IAM role via IRSA, giving the workloads S3
# access scoped to the artifacts bucket instead of the whole node role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anomaly-sa
  namespace: mlops
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::170420138680:role/anomaly-mlops-irsa-dev

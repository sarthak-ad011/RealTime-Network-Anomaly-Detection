# Drives the CANARY Service. Argo Rollouts scopes the stable and canary Services by
# pod-template-hash, and this Rollout has no traffic router (no ingress or service
# mesh), so setWeight scales replicas rather than splitting traffic. Without a client
# aimed at the canary Service the new pods stay idle and the AnalysisTemplate
# evaluates an empty result set. In production an ingress controller would perform
# this weighting for real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-canary
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen-canary
  template:
    metadata:
      labels:
        app: loadgen-canary
    spec:
      serviceAccountName: anomaly-sa
      containers:
        - name: loadgen
          image: 170420138680.dkr.ecr.ap-south-1.amazonaws.com/anomaly-mlops:4ae4691
          command: ["python", "traffic_generator/generator.py"]
          args:
            - --endpoint=http://anomaly-inference-canary.mlops.svc.cluster.local
            - --mode=attack
            - --rps=10
            - --attack-rate=0.06
            - --reference=s3://anomaly-mlops-artifacts-dev/reference/training_reference.parquet
          env:
            - name: AWS_REGION
              value: ap-south-1
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

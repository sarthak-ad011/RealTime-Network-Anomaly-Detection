# In-cluster load generator. Applied manually for demos, deliberately NOT part of the
# Argo CD application: it is a test harness, not part of the deployed system.
# Talks to the ClusterIP Service so requests are balanced across every replica —
# `kubectl port-forward` pins to a single pod and would leave the others idle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      serviceAccountName: anomaly-sa
      containers:
        - name: loadgen
          image: 170420138680.dkr.ecr.ap-south-1.amazonaws.com/anomaly-mlops:26311a4
          command: ["python", "traffic_generator/generator.py"]
          args:
            - --endpoint=http://anomaly-inference-stable.mlops.svc.cluster.local
            - --mode=attack
            - --rps=25
            - --attack-rate=0.06
            - --reference=s3://anomaly-mlops-artifacts-dev/reference/training_reference.parquet
          env:
            - name: AWS_REGION
              value: ap-south-1
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
